name: Publish gem to rubygems.org

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'huginn/huginn_agent'
    runs-on: ubuntu-latest

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/${{ steps.gem.outputs.name }}/versions/${{ steps.gem.outputs.version }}

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Read gem metadata
        id: gem
        run: |
          bundle exec ruby -e '
            spec = Gem::Specification.load(Dir["*.gemspec"].fetch(0))
            puts "name=#{spec.name}"
            puts "version=#{spec.version}"
          ' >> "$GITHUB_OUTPUT"

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1.4.1

  release:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-releases
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
