queue_rules:
- name: dependency-updates
  batch_size: 1
  checks_timeout: auto
  merge_method: merge
  queue_conditions:
  - base = master
  - author ~= ^(dependabot|renovate|lockfile-maintenance)\[bot\]$
  - -draft
  - -conflict
  - '#approved-reviews-by >= 1'
  - '#changes-requested-reviews-by = 0'
  - check-success = Ruby 3.4
  - check-success = Ruby ruby
  merge_conditions: &id001
  - '#approved-reviews-by >= 1'
  - '#changes-requested-reviews-by = 0'
  - check-success = Ruby 3.4
  - check-success = Ruby ruby
  batch_max_wait_time: 1 min
merge_protections:
- name: approved-dependency-updates
  if:
  - base = master
  - author ~= ^(dependabot|renovate|lockfile-maintenance)\[bot\]$
  success_conditions: *id001
merge_protections_settings:
  auto_merge_conditions:
  - base = master
  - author ~= ^(dependabot|renovate|lockfile-maintenance)\[bot\]$
  - -draft
  - -conflict
  - '#approved-reviews-by >= 1'
  - '#changes-requested-reviews-by = 0'
  - check-success = Ruby 3.4
  - check-success = Ruby ruby
  reporting_method: check-runs
